name: Advisory approval validation

on:
  pull_request:
    paths:
      - ".gitignore"
      - ".github/workflows/advisory-approval-validation.yml"
      - "pyproject.toml"
      - "camguard/advisory_ingest.py"
      - "camguard/advisory_review.py"
      - "camguard/cli.py"
      - "camguard/service_exposure.py"
      - "camguard/reporting.py"
      - "camguard/pdf_report.py"
      - "tests/test_advisory_ingest.py"
      - "tests/test_advisory_review.py"
      - "tests/test_service_exposure.py"
      - "tests/test_report_output_security.py"

permissions:
  contents: read

jobs:
  validate-approvals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: python -m pip install -e .
      - name: Run ingestion and synthetic approval tests
        run: |
          python -m unittest discover -s tests -p 'test_advisory_ingest.py' -v
          python -m unittest discover -s tests -p 'test_advisory_review.py' -v
      - name: Build wheel and reject sensitive local records
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/camguard-wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("/tmp/camguard-wheel").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")
          forbidden = (
              "data/advisories/inbox/",
              "data/advisories/approvals.json",
              "data/advisories/approved-advisories.json",
              "data/advisories/review-audit.jsonl",
          )
          with ZipFile(wheels[0]) as archive:
              members = archive.namelist()
          leaked = [name for name in members if any(item in name for item in forbidden)]
          if leaked:
              raise SystemExit("Sensitive advisory data found in wheel: " + ", ".join(leaked))
          print(f"Package contents check passed: {wheels[0].name}")
          PY
