name: Release artifact validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-artifact-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-install-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pushed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify source and run regression suite
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python -m camguard --help
          python -m camguard assess --help
          python -m camguard review-advisories --help
          python -m camguard inspection --help

      - name: Build and inspect 0.7.0 wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from email.parser import Parser
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              meta = next((n for n in names if n.endswith(".dist-info/METADATA")), None)
              if not meta:
                  raise SystemExit("Wheel metadata missing")
              version = Parser().parsestr(archive.read(meta).decode()).get("Version")
              if version != "0.7.0":
                  raise SystemExit(f"Expected 0.7.0, got {version}")
              forbidden = ("advisories/inbox/", "approvals.json", "approved-advisories.json",
                           "review-audit.jsonl", "client-inventory", "customer-inventory")
              leaked = [n for n in names if any(token in n.lower() for token in forbidden)]
              if leaked:
                  raise SystemExit(f"Sensitive/client paths found: {leaked}")
              if not any(n.startswith("camguard/") for n in names):
                  raise SystemExit("CamGuard package missing")
          print(f"Wheel validation PASS: {wheels[0]}")
          PY

      - name: Install outside checkout and verify CLI
        run: |
          set -euo pipefail
          python -m venv /tmp/camguard-release-venv
          cd /tmp
          /tmp/camguard-release-venv/bin/python -m pip install "${GITHUB_WORKSPACE}"/dist/*.whl
          /tmp/camguard-release-venv/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import camguard, sys
          if version("trintech-camguard") != "0.7.0":
              raise SystemExit("Installed version mismatch")
          if Path(sys.prefix).resolve() not in Path(camguard.__file__).resolve().parents:
              raise SystemExit("Import resolved outside clean virtual environment")
          print("Clean installation: PASS")
          PY
          /tmp/camguard-release-venv/bin/camguard --help
          /tmp/camguard-release-venv/bin/camguard assess --help
          /tmp/camguard-release-venv/bin/camguard review-advisories --help
          /tmp/camguard-release-venv/bin/camguard inspection --help

      - name: Record SHA-256 and validation results
        run: |
          set -euo pipefail
          mkdir -p /tmp/camguard-validation
          cp dist/*.whl /tmp/camguard-validation/
          cd /tmp/camguard-validation
          sha256sum ./*.whl | tee SHA256SUMS.txt
          {
            echo "Source commit: ${GITHUB_SHA}"
            echo "Package version: 0.7.0"
            echo "Regression suite: PASS"
            echo "Clean virtual environment install: PASS"
            echo "CLI help: PASS"
            echo "Sensitive/client data check: PASS"
            echo "Wheel SHA-256:"
            cat SHA256SUMS.txt
          } | tee VALIDATION.txt

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camguard-0.7.0-release-validation
          path: /tmp/camguard-validation/
          if-no-files-found: error
          retention-days: 30
