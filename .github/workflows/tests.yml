name: Tests
on:
  push:
    branches: [main, feature/risk-prioritization-hardening-v1]
  pull_request:
    branches: [main, feature/risk-prioritization-v1, feature/service-exposure-assessment-0.6.0]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python -m camguard --help
