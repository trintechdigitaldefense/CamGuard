[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trintech-camguard"
version = "0.7.0"
description = "Authorized, read-only CCTV and IP camera security assessment with analyst-gated vulnerability intelligence and explainable risk reports"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "TrinTech Digital Defense"}]
dependencies = ["reportlab>=4.0"]

[project.scripts]
camguard = "camguard.cli:main"

[tool.setuptools]
packages = ["camguard"]
